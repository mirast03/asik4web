    <main class="page-wrap">
        <h1>Task 3: Bootstrap Validation</h1>
        <p class="page-note">Example of Bootstrap valid and invalid states. HTML5 checks the fields when you submit.</p>
        <form class="row g-3" action="#">
            <div class="col-md-6">
                <label class="form-label" for="name">Name</label>
                <input class="form-control is-valid" id="name" name="name" type="text" value="Alex" required maxlength="50">
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Name is required.</div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control is-invalid" id="email" name="email" type="email" placeholder="name@example.com" required maxlength="100" aria-describedby="emailFeedback">
                <div id="emailFeedback" class="invalid-feedback">Enter a valid email address.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>
            <div class="col-12">
                <label class="form-label" for="message">Message</label>
                <textarea class="form-control is-invalid" id="message" name="message" rows="5" required maxlength="500"></textarea>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Message is required.</div>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Submit</button>
            </div>
        </form>
    </main>
</body>
