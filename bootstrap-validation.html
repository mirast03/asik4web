<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <form novalidate>
        <div class="row g-3">
            <div class="col-md-6">
            <label class="form-label" for="name">Name</label>
        <input class="form-control " id="name" name="name" type="text" placeholder="Your name" required maxlength="50">
        <div class="valid-feedback">Thats good</div>
        <div class="invalid-feedback">Name is required.</div>
        <div class="form-text">Enter your name</div>
    </div>
        <div class="col-md-6">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com" required maxlength="100">
        <div class="valid-feedback">Thats good</div>
        <div class="invalid-feedback">Enter a valid email address.</div>
        <div class="form-text">We will use this email to reply.</div>
    </div>
        <div class="col-12">
        <label class="form-label" for="message">Message</label>
        <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message" required maxlength="500"></textarea>
        <div class="valid-feedback">Thats good</div>
        <div class="invalid-feedback">Message is required.</div>
    </div>
    <div class="col-12">
        <button class="btn btn-primary" type="submit">Submit</button></div>
    </div>
    </form>
</body>
</html>
