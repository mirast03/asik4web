    <main class="page-wrap">
        <h1>Task 1: HTML5 Validation</h1>
        <p class="page-note">Try an empty field, an invalid email, or text beyond the length limit.</p>
        <form class="basic-form" action="#">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required maxlength="50">

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required maxlength="100">

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required maxlength="500"></textarea>

            <button type="submit">Submit</button>
        </form>
    </main>
