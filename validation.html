<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required maxlenght="50">
        <br>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required maxlenght="100">
        <br>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required maxlenght="500"></textarea>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
