    <main class="page-wrap">
        <h1>Task 2: Bootstrap Form</h1>
        <p class="page-note">Bootstrap form classes, responsive grid, placeholders, and helper text.</p>
        <form class="row g-3" action="#">
            <div class="col-md-6">
                <label class="form-label" for="name">Name</label>
                <input class="form-control" id="name" name="name" type="text" placeholder="Your name">
                <div class="form-text">Enter your name.</div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com">
                <div class="form-text">We will use this email to reply.</div>
            </div>
            <div class="col-12">
                <label class="form-label" for="message">Message</label>
                <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message"></textarea>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Submit</button>
            </div>
        </form>
    </main>
</body>
